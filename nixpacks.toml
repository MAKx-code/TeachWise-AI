[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

# Note: seeding is NOT done at build time because Railway's build filesystem
# is separate from the runtime filesystem on most plans.
# Seeding happens at start time via the start command below.

[start]
# seed_academic.py is idempotent — safe to run on every container start.
# It calls create_app() which creates all DB tables, then seeds CS201 data.
cmd = "python seed_academic.py && gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
