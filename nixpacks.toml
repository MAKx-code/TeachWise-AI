[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
# seed_academic.py is idempotent (skips if already seeded)
# It first runs create_app() which creates all DB tables, then seeds CS201 data
cmds = ["python seed_academic.py"]

[start]
cmd = "gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
